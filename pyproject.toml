[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tactibot"
version = "0.1.0"
description = "CASTERBOT — SAM 3 pipeline for Copa FutBotMX robotic football"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26,<2",
  "opencv-python-headless>=4.8",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tactibot = "tactibot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tactibot*"]
